<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5365C">
  <title>StudySpot - คาเฟ่และสถานที่อ่านหนังสือราคานักศึกษา</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #F5365C;
      --primary-dark: #D81B60;
      --primary-gradient: linear-gradient(135deg, #FF4B72 0%, #D81B60 100%);
      --primary-light: #FFF0F3;

      --bg: #F5F7FB;
      --card-bg: #FFFFFF;

      --text-main: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;

      --border: #E2E8F0;
      --tag-bg: #F1F5F9;
      --tag-text: #475569;

      --green: #10B981;
      --green-bg: #ECFDF5;

      --shadow-sm: 0 3px 12px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 25px 60px rgba(15, 23, 42, 0.15);

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-full: 999px;

      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        'Kanit',
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      background:
        radial-gradient(
          circle at top,
          #fff1f4 0%,
          var(--bg) 35%,
          #eef2f7 100%
        );

      color: var(--text-main);

      overflow: hidden;
    }

    /* ========================================
       APP CONTAINER
    ======================================== */

    .app-container {
      width: 100%;
      max-width: 480px;

      height: 100dvh;
      min-height: 100dvh;

      margin: 0 auto;

      background: var(--card-bg);

      display: flex;
      flex-direction: column;

      position: relative;

      overflow: hidden;

      box-shadow: none;
    }

    @media (min-width: 600px) {
      body {
        padding: 24px;
        overflow: auto;
      }

      .app-container {
        height: calc(100dvh - 48px);
        min-height: 650px;

        border-radius: var(--radius-xl);

        border: 1px solid rgba(226, 232, 240, 0.9);

        box-shadow: var(--shadow-lg);

        overflow: hidden;
      }
    }

    /* ========================================
       HEADER
    ======================================== */

    .header {
      flex-shrink: 0;

      padding:
        max(18px, env(safe-area-inset-top))
        18px
        12px;

      background: rgba(255, 255, 255, 0.96);

      border-bottom: 1px solid #F1F5F9;

      z-index: 20;

      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
    }

    .user-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;
    }

    .greeting {
      font-size: 0.76rem;
      font-weight: 400;

      color: var(--text-muted);

      margin-bottom: 2px;
    }

    .username {
      font-size: 1.18rem;
      font-weight: 700;

      color: var(--text-main);

      line-height: 1.25;
    }

    .avatar {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--primary-gradient);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 0.88rem;
      font-weight: 700;

      color: white;

      cursor: pointer;

      box-shadow:
        0 6px 16px rgba(245, 54, 92, 0.28);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .avatar:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 20px rgba(245, 54, 92, 0.35);
    }

    .avatar:active {
      transform: scale(0.94);
    }

    /* ========================================
       SEARCH
    ======================================== */

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;

      padding: 12px 15px 12px 44px;

      border-radius: var(--radius-md);

      border: 1.5px solid var(--border);

      background: #F8FAFC;

      color: var(--text-main);

      font-size: 0.88rem;

      outline: none;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-light);
    }

    .search-input:focus {
      border-color: var(--primary);

      background: white;

      box-shadow:
        0 0 0 4px rgba(245, 54, 92, 0.09);
    }

    .search-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 0.95rem;

      color: var(--text-light);

      pointer-events: none;
    }

    /* ========================================
       FILTER
    ======================================== */

    .filter-group {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding:
        1px
        2px
        4px;

      scrollbar-width: none;

      overscroll-behavior-x: contain;

      -webkit-overflow-scrolling: touch;
    }

    .filter-group::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      flex-shrink: 0;

      padding: 7px 13px;

      border-radius: var(--radius-full);

      border: 1.5px solid var(--border);

      background: white;

      color: var(--text-muted);

      font-size: 0.77rem;
      font-weight: 500;

      white-space: nowrap;

      cursor: pointer;

      transition:
        all 0.2s ease;
    }

    .filter-chip:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
    }

    .filter-chip.active {
      background: var(--text-main);
      color: white;

      border-color: var(--text-main);

      box-shadow:
        0 4px 10px rgba(15, 23, 42, 0.15);
    }

    /* ========================================
       CONTENT AREA
    ======================================== */

    .content-area {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        16px
        16px
        calc(var(--nav-height) + 24px);

      background:
        linear-gradient(
          180deg,
          #F7F8FB 0%,
          #F3F5F9 100%
        );

      display: flex;
      flex-direction: column;

      gap: 16px;

      scroll-behavior: smooth;

      overscroll-behavior-y: contain;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }

    .content-area::-webkit-scrollbar {
      width: 5px;
    }

    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    .content-area::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* ========================================
       PLACE CARD
    ======================================== */

    .place-card {
      flex-shrink: 0;

      width: 100%;

      background: white;

      border-radius: var(--radius-lg);

      overflow: hidden;

      box-shadow: var(--shadow-sm);

      border: 1px solid rgba(226, 232, 240, 0.75);

      cursor: pointer;

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease;
    }

    .place-card:hover {
      transform: translateY(-3px);

      box-shadow: var(--shadow-md);
    }

    .place-card:active {
      transform: scale(0.995);
    }

    /* ========================================
       IMAGE
    ======================================== */

    .place-img-container {
      position: relative;

      width: 100%;
      height: 165px;

      overflow: hidden;

      background: #E2E8F0;
    }

    .place-img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition: transform 0.45s ease;
    }

    .place-card:hover .place-img {
      transform: scale(1.035);
    }

    .bookmark-btn {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 37px;
      height: 37px;

      border: 1px solid rgba(255,255,255,0.7);

      border-radius: 50%;

      background: rgba(255,255,255,0.92);

      backdrop-filter: blur(8px);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.05rem;

      cursor: pointer;

      z-index: 3;

      box-shadow:
        0 5px 14px rgba(0,0,0,0.12);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .bookmark-btn:hover {
      transform: scale(1.08);
    }

    .bookmark-btn:active {
      transform: scale(0.88);
    }

    /* ========================================
       META BAR
    ======================================== */

    .place-meta-bar {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 8px;

      padding: 9px 13px;

      background: #FAFBFC;

      border-bottom: 1px solid #F1F5F9;

      color: var(--text-muted);

      font-size: 0.72rem;
    }

    .meta-item {
      display: flex;
      align-items: center;

      gap: 4px;

      min-width: 0;

      font-weight: 400;
    }

    .meta-item:last-child {
      text-align: right;
    }

    /* ========================================
       CARD CONTENT
    ======================================== */

    .place-info {
      padding: 14px;
    }

    .place-title-row {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 10px;

      margin-bottom: 5px;
    }

    .place-name {
      font-size: 1rem;
      font-weight: 700;

      line-height: 1.35;

      color: var(--text-main);
    }

    .place-price {
      flex-shrink: 0;

      font-size: 0.7rem;
      font-weight: 600;

      color: var(--green);

      background: var(--green-bg);

      border: 1px solid rgba(16,185,129,0.18);

      padding: 4px 8px;

      border-radius: var(--radius-full);

      white-space: nowrap;
    }

    .place-location {
      display: flex;
      align-items: flex-start;

      gap: 3px;

      color: var(--text-muted);

      font-size: 0.76rem;

      line-height: 1.4;

      margin-bottom: 7px;
    }

    .place-highlight {
      color: #475569;

      font-size: 0.79rem;

      line-height: 1.5;

      margin-bottom: 11px;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    /* ========================================
       TAGS
    ======================================== */

    .feature-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 500;

      background: var(--tag-bg);

      color: var(--tag-text);

      padding: 4px 7px;

      border-radius: 6px;

      border: 1px solid rgba(226,232,240,0.65);
    }

    /* ========================================
       MODAL
    ======================================== */

    .modal-overlay {
      position: absolute;

      inset: 0;

      background: rgba(15, 23, 42, 0.62);

      backdrop-filter: blur(5px);

      display: none;

      align-items: flex-end;
      justify-content: center;

      z-index: 100;

      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-content {
      width: 100%;

      max-height: 90%;

      background: white;

      border-radius:
        24px
        24px
        0
        0;

      padding:
        12px
        16px
        max(20px, env(safe-area-inset-bottom));

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior: contain;

      box-shadow:
        0 -15px 45px rgba(0,0,0,0.2);

      animation:
        slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);

      scrollbar-width: thin;

      scrollbar-color: #CBD5E1 transparent;
    }

    .modal-content::-webkit-scrollbar {
      width: 5px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-content::before {
      content: ;

      display: block;

      width: 42px;
      height: 4px;

      background: #CBD5E1;

      border-radius: 20px;

      margin: 0 auto 12px;
    }

    .modal-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 10px;

      position: sticky;

      top: 0;

      background: white;

      padding-bottom: 9px;

      z-index: 5;
    }

    .modal-title {
      font-size: 1.08rem;
      font-weight: 700;

      line-height: 1.35;
    }

    .close-btn {
      flex-shrink: 0;

      width: 34px;
      height: 34px;

      border: none;

      border-radius: 50%;

      background: #F1F5F9;

      color: var(--text-muted);

      font-size: 0.9rem;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: #E2E8F0;
      color: var(--text-main);
    }

    .modal-body {
      display: flex;
      flex-direction: column;

      gap: 11px;

      font-size: 0.82rem;

      padding-bottom: 5px;
    }

    .modal-img {
      width: 100%;
      height: 190px;

      object-fit: cover;

      border-radius: var(--radius-lg);

      display: block;
    }

    .info-row {
      display: flex;

      gap: 8px;

      color: var(--text-main);

      line-height: 1.5;
    }

    .info-label {
      min-width: 90px;

      flex-shrink: 0;

      font-weight: 600;

      color: var(--text-muted);
    }

    .action-btn {
      width: 100%;

      margin-top: 7px;

      padding: 12px;

      border: none;

      border-radius: var(--radius-md);

      background: var(--primary-gradient);

      color: white;

      text-decoration: none;

      font-size: 0.88rem;
      font-weight: 600;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      box-shadow:
        0 7px 18px rgba(245,54,92,0.28);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 10px 22px rgba(245,54,92,0.35);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* ========================================
       NAVIGATION
    ======================================== */

    .nav-bar {
      flex-shrink: 0;

      height: var(--nav-height);

      padding:
        7px
        8px
        max(7px, env(safe-area-inset-bottom));

      background: rgba(255,255,255,0.97);

      border-top: 1px solid #EDEFF3;

      display: flex;

      justify-content: space-around;
      align-items: center;

      z-index: 30;

      box-shadow:
        0 -4px 15px rgba(15,23,42,0.04);
    }

    .nav-item {
      flex: 1;

      max-width: 90px;

      height: 52px;

      border-radius: 13px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 2px;

      color: var(--text-muted);

      font-size: 0.67rem;
      font-weight: 500;

      cursor: pointer;

      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-item:hover {
      background: #F8FAFC;
    }

    .nav-item.active {
      color: var(--primary);

      background: var(--primary-light);
    }

    .nav-item.active .nav-icon {
      transform: translateY(-1px);
    }

    .nav-icon {
      font-size: 1.22rem;

      line-height: 1;

      transition:
        transform 0.2s ease;
    }

    /* ========================================
       PROFILE
    ======================================== */

    .profile-card {
      flex-shrink: 0;

      background: white;

      border-radius: var(--radius-lg);

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 13px;

      box-shadow: var(--shadow-sm);

      border: 1px solid rgba(226,232,240,0.75);
    }

    .profile-title {
      color: var(--primary);

      font-size: 1.05rem;
      font-weight: 700;

      padding-bottom: 9px;

      border-bottom:
        2px solid var(--primary-light);
    }

    /* ========================================
       EMPTY STATE
    ======================================== */

    .empty-state {
      min-height: 300px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 7px;

      text-align: center;

      color: var(--text-muted);

      padding: 30px 15px;
    }

    .empty-state-icon {
      font-size: 2.5rem;

      opacity: 0.6;

      margin-bottom: 5px;
    }

    /* ========================================
       BACK TO TOP
    ======================================== */

    .back-to-top {
      position: absolute;

      right: 18px;
      bottom: calc(var(--nav-height) + 18px);

      width: 40px;
      height: 40px;

      border: none;

      border-radius: 50%;

      background: rgba(30,41,59,0.92);

      color: white;

      font-size: 1rem;

      cursor: pointer;

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 40;

      box-shadow:
        0 6px 18px rgba(15,23,42,0.22);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .back-to-top:hover {
      transform: translateY(-2px);
    }

    .back-to-top.show {
      display: flex;
    }

    /* ========================================
       LOADING EFFECT
    ======================================== */

    .place-img {
      opacity: 0;

      animation: imageFade 0.45s ease forwards;
    }

    @keyframes imageFade {
      to {
        opacity: 1;
      }
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 360px) {
      .header {
        padding-left: 13px;
        padding-right: 13px;
      }

      .content-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .place-img-container {
        height: 145px;
      }

      .username {
        font-size: 1.05rem;
      }

      .place-price {
        font-size: 0.64rem;
      }
    }
  </style>

</head>

  /* =========================================
     RENDER PLACES
  ========================================= */

  function renderPlaces(data) {

    const container =
      document.getElementById('placeList');

    container.innerHTML = '';

    if (data.length === 0) {

      container.innerHTML = `
        <div class="empty-state">

          <span class="empty-state-icon">
            🔍
          </span>

          <p>
            ไม่พบสถานที่ที่คุณกำลังค้นหา
          </p>

        </div>
      `;

      return;
    }


    data.forEach(place => {

      const card =
        document.createElement('div');

      card.className = 'place-card';


      const isBookmarked =
        bookmarkedIds.includes(place.id);


      card.innerHTML = `

        <div class="place-img-container">

          <button
            class="bookmark-btn ${isBookmarked ? 'active-bm' : ''}"
            onclick="toggleBookmark(event, ${place.id})"
            aria-label="บันทึก ${place.name}"
          >
            ${isBookmarked ? '❤️' : '🤍'}
          </button>

          <img
            src="${place.image}"
            alt="${place.name}"
            class="place-img"
            loading="lazy"
            onclick="openDetailModal(${place.id})"
          >

        </div>


        <div
          class="place-meta-bar"
          onclick="openDetailModal(${place.id})"
        >

          <div class="meta-item">
            <span>🕒</span>
            <span>${place.hours}</span>
          </div>

          <div class="meta-item">
            <span>📍</span>
            <span>
              ${place.distanceKm} กม.
              (${place.travelTimeMin} นาที)
            </span>
          </div>

        </div>


        <div
          class="place-info"
          onclick="openDetailModal(${place.id})"
        >

          <div class="place-title-row">

            <div class="place-name">
              ${place.name}
            </div>

            <div class="place-price">
              ${place.price}
            </div>

          </div>


          <div class="place-location">
            📍 ${place.detail}
          </div>


          <div class="place-highlight">
            ${place.highlight}
          </div>


          <div class="feature-tags">

            ${place.tags
              .map(tag =>
                `<span class="tag">${tag}</span>`
              )
              .join('')
            }

          </div>

        </div>

      `;

      container.appendChild(card);

    });
  }


  /* =========================================
     DETAIL MODAL
  ========================================= */

  function openDetailModal(placeId) {

    const place =
      places.find(p => p.id === placeId);

    if (!place) return;


    document.getElementById('modalName')
      .textContent = place.name;


    const modalBody =
      document.getElementById('modalBody');


    modalBody.innerHTML = `

      <img
        src="${place.image}"
        alt="${place.name}"
        class="modal-img"
      >


      <div class="info-row">
        <span class="info-label">
          ราคาเริ่มต้น:
        </span>

        <span>
          ${place.price}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          ทำเลที่ตั้ง:
        </span>

        <span>
          ${place.detail}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เวลาเปิด-ปิด:
        </span>

        <span>
          ${place.hours}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          จุดเด่น:
        </span>

        <span>
          ${place.highlight}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เมนูแนะนำ:
        </span>

        <span>
          ${place.recommendedMenu}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          การจอดรถ:
        </span>

        <span>
          ${place.parking}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เบอร์ติดต่อ:
        </span>

        <span>
          ${place.phone}
        </span>
      </div>


      <div class="feature-tags">

        ${place.tags
          .map(tag =>
            `<span class="tag">${tag}</span>`
          )
          .join('')
        }

      </div>


      <a
        class="action-btn"
        href="${place.mapUrl}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 เปิดแผนที่ Google Maps นำทาง
      </a>

    `;


    const modal =
      document.getElementById('detailModal');

    modal.style.display = 'flex';

    document.body.style.overflow = 'hidden';
  }


  function closeModal() {

    document.getElementById('detailModal')
      .style.display = 'none';

    document.body.style.overflow = 'hidden';
  }


  function handleOverlayClick(event) {

    if (
      event.target ===
      document.getElementById('detailModal')
    ) {
      closeModal();
    }

  }


  /* =========================================
     SEARCH
  ========================================= */

  function handleSearch() {

    const query =
      document
        .getElementById('searchInput')
        .value
        .toLowerCase()
        .trim();


    const filtered =
      places.filter(place => {

        const matchesText =
          place.name
            .toLowerCase()
            .includes(query)

          ||

          place.detail
            .toLowerCase()
            .includes(query)

          ||

          place.highlight
            .toLowerCase()
            .includes(query);


        const matchesCategory =
          currentCategory === 'all'
          ||
          place.categories.includes(
            currentCategory
          );


        return matchesText && matchesCategory;

      });


    renderPlaces(filtered);

    scrollToTop();
  }


  /* =========================================
     BOOKMARK
  ========================================= */

  function toggleBookmark(event, placeId) {

    event.stopPropagation();


    const index =
      bookmarkedIds.indexOf(placeId);


    if (index > -1) {

      bookmarkedIds.splice(index, 1);

    } else {

      bookmarkedIds.push(placeId);

    }


    if (currentTab === 'ค้นหา') {

      handleSearch();

    } else if (currentTab === 'บุ๊กมาร์ก') {

      renderBookmarks();

    }

  }


  function renderBookmarks() {

    const bookmarkedPlaces =
      places.filter(place =>
        bookmarkedIds.includes(place.id)
      );


    if (bookmarkedPlaces.length === 0) {

      const container =
        document.getElementById('placeList');


      container.innerHTML = `

        <div class="empty-state">

          <span class="empty-state-icon">
            ⭐
          </span>

          <p>
            ยังไม่มีรายการที่ถูกบันทึกไว้
          </p>

          <small>
            กด 🤍 บนสถานที่ที่คุณชอบ
          </small>

        </div>

      `;

    } else {

      renderPlaces(bookmarkedPlaces);

    }

    scrollToTop();
  }


  /* =========================================
     PROFILE
  ========================================= */

  function renderProfile() {

    const container =
      document.getElementById('placeList');


    const userMapUrl =
      `https://www.google.com/maps/search/?api=1&query=${userInfo.lat},${userInfo.lng}`;


    container.innerHTML = `

      <div class="profile-card">

        <div class="profile-title">
          ข้อมูลส่วนตัวผู้ใช้
        </div>


        <div class="info-row">
          <span class="info-label">
            ชื่อ-นามสกุล:
          </span>

          <span>
            ${userInfo.name}
          </span>
        </div>


        <div class="info-row">
          <span class="info-label">
            รหัสนักศึกษา:
          </span>

          <span>
            ${userInfo.studentId}
          </span>
        </div>


        <div class="info-row">
          <span class="info-label">
            พิกัดปัจจุบัน:
          </span>

          <span>
            ${userInfo.location}
          </span>
        </div>


        <a
          class="action-btn"
          href="${userMapUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 เปิดแผนที่พิกัดของฉัน
        </a>

      </div>

    `;

    scrollToTop();
  }


  /* =========================================
     FILTER
  ========================================= */

  function filterPlaces(category, element) {

    currentCategory = category;


    document
      .querySelectorAll('.filter-chip')
      .forEach(button => {

        button.classList.remove('active');

      });


    element.classList.add('active');


    handleSearch();
  }


  /* =========================================
     NAVIGATION
  ========================================= */

  function switchNav(element, pageName) {

    currentTab = pageName;


    document
      .querySelectorAll('.nav-item')
      .forEach(item => {

        item.classList.remove('active');

      });


    element.classList.add('active');


    navigateTo(pageName);
  }


  function switchNavToProfile() {

    const profileNav =
      document.getElementById('navProfile');


    switchNav(
      profileNav,
      'โปรไฟล์'
    );
  }


  function navigateTo(pageName) {

    const filterGroup =
      document.getElementById(
        'filterGroupContainer'
      );

    const searchBox =
      document.getElementById(
        'searchBoxContainer'
      );

    const headerTitle =
      document.getElementById(
        'headerTitle'
      );


    if (pageName === 'ค้นหา') {

      filterGroup.style.display = 'flex';

      searchBox.style.display = 'block';

      headerTitle.textContent ='พิกัดที่อ่านหนังสือวันนี้';


      handleSearch();

    }


    else if (pageName === 'บุ๊กมาร์ก') {

      filterGroup.style.display = 'none';

      searchBox.style.display = 'none';

      headerTitle.textContent =
        'ร้านที่บุ๊กมาร์กไว้ ⭐';


      renderBookmarks();

    }


    else if (pageName === 'แผนที่') {

      window.open(
        'https://www.google.com/maps/search/คาเฟ่อ่านหนังสือ+พิษณุโลก',
        '_blank',
        'noopener,noreferrer'
      );

    }


    else if (pageName === 'โปรไฟล์') {

      filterGroup.style.display = 'none';

      searchBox.style.display = 'none';

      headerTitle.textContent =
        'โปรไฟล์ผู้ใช้ 👤';


      renderProfile();

    }

  }


  /* =========================================
     SCROLL
  ========================================= */

  const placeList =
    document.getElementById('placeList');

  const backToTop =
    document.getElementById('backToTop');


  placeList.addEventListener(
    'scroll',
    function() {

      if (placeList.scrollTop > 350) {

        backToTop.classList.add('show');

      } else {

        backToTop.classList.remove('show');

      }

    },
    { passive: true }
  );


  function scrollToTop() {

    placeList.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  /* =========================================
     KEYBOARD
  ========================================= */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Escape'
      ) {

        closeModal();

      }

    }
  );


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderPlaces(places);

</script>

</body>
</html>
