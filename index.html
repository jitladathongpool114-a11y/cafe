<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#F5365C">

<title>StudySpot — คาเฟ่และสถานที่อ่านหนังสือ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

  --primary: #F5365C;
  --primary-dark: #D81B60;

  --primary-gradient:
    linear-gradient(
      135deg,
      #FF5578 0%,
      #D81B60 100%
    );

  --primary-light: #FFF0F3;

  --bg: #F4F6FA;

  --card-bg: #FFFFFF;

  --text-main: #172033;
  --text-muted: #64748B;
  --text-light: #94A3B8;

  --border: #E2E8F0;

  --tag-bg: #F1F5F9;
  --tag-text: #475569;

  --green: #10B981;
  --green-bg: #ECFDF5;

  --yellow: #F59E0B;
  --yellow-bg: #FFFBEB;

  --blue: #3B82F6;
  --blue-bg: #EFF6FF;

  --shadow-sm:
    0 4px 16px rgba(15,23,42,.055);

  --shadow-md:
    0 14px 35px rgba(15,23,42,.10);

  --shadow-lg:
    0 30px 70px rgba(15,23,42,.16);

  --radius-xl: 26px;
  --radius-lg: 19px;
  --radius-md: 14px;

  --radius-full: 999px;

  --nav-height: 72px;

  --header-height: 170px;
}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;

  margin: 0;
  padding: 0;

  font-family:
    'Kanit',
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
  scroll-behavior: smooth;
}

body {

  min-height: 100%;

  background:
    radial-gradient(
      circle at top,
      #fff0f4 0%,
      #F4F6FA 42%,
      #EDEFF5 100%
    );

  color: var(--text-main);

  overflow: hidden;

  transition:
    background .3s ease,
    color .3s ease;
}

button,
input {
  font-family: inherit;
}


/* =========================================================
   APP
========================================================= */

.app-container {

  width: 100%;
  max-width: 500px;

  height: 100dvh;
  min-height: 100dvh;

  margin: 0 auto;

  background: var(--card-bg);

  display: flex;
  flex-direction: column;

  position: relative;

  overflow: hidden;

  transition:
    background .3s ease;
}


@media (min-width: 600px) {

  body {
    padding: 24px;
    overflow: auto;
  }

  .app-container {

    height:
      calc(100dvh - 48px);

    min-height: 650px;

    border-radius:
      var(--radius-xl);

    border:
      1px solid rgba(226,232,240,.9);

    box-shadow:
      var(--shadow-lg);

    overflow: hidden;
  }
}


/* =========================================================
   HEADER
========================================================= */

.header {

  flex-shrink: 0;

  /* วาง Header ซ้อนทับเนื้อหา เพื่อไม่ให้เหลือช่องว่างเมื่อซ่อน */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;

  z-index: 50;

  padding:
    max(17px, env(safe-area-inset-top))
    18px
    12px;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid #EEF1F5;

  box-shadow:
    0 5px 18px rgba(15,23,42,.035);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  transition:
    transform .34s cubic-bezier(.4,0,.2,1),
    opacity .28s ease,
    box-shadow .3s ease;

  will-change:
    transform;
}


/*
   สำคัญ:
   เมื่อ scroll ลง Header จะเลื่อนออกด้านบน
   โดยไม่เปลี่ยนข้อมูลด้านล่าง
*/

.header.header-hidden {

  transform:
    translateY(-100%);

  opacity: 0;

  pointer-events: none;
}


/* =========================================================
   USER
========================================================= */

.user-profile {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap: 12px;

  margin-bottom:
    14px;
}

.greeting {

  font-size:
    .72rem;

  color:
    var(--text-muted);

  margin-bottom:
    2px;
}

.username {

  font-size:
    1.12rem;

  font-weight:
    700;

  line-height:
    1.3;
}

.avatar {

  width: 43px;
  height: 43px;

  flex-shrink: 0;

  border-radius:
    50%;

  background:
    var(--primary-gradient);

  color:
    white;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    1rem;

  cursor:
    pointer;

  box-shadow:
    0 7px 20px rgba(245,54,92,.28);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.avatar:hover {

  transform:
    translateY(-2px)
    scale(1.03);

  box-shadow:
    0 10px 25px rgba(245,54,92,.35);
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {

  position:
    relative;

  margin-bottom:
    11px;
}

.search-input {

  width:
    100%;

  height:
    44px;

  padding:
    0 42px;

  border:
    1.5px solid var(--border);

  border-radius:
    var(--radius-md);

  outline:
    none;

  background:
    #F8FAFC;

  color:
    var(--text-main);

  font-size:
    .84rem;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.search-input::placeholder {
  color:
    var(--text-light);
}

.search-input:focus {

  background:
    white;

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 4px
    rgba(245,54,92,.09);
}

.search-icon {

  position:
    absolute;

  left:
    15px;

  top:
    50%;

  transform:
    translateY(-50%);

  font-size:
    .9rem;

  color:
    var(--text-light);

  pointer-events:
    none;
}

.clear-search {

  position:
    absolute;

  right:
    10px;

  top:
    50%;

  transform:
    translateY(-50%);

  width:
    27px;

  height:
    27px;

  border:
    none;

  border-radius:
    50%;

  background:
    #E2E8F0;

  color:
    #64748B;

  cursor:
    pointer;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    .72rem;
}


/* =========================================================
   FILTER
========================================================= */

.filter-group {

  display:
    flex;

  gap:
    7px;

  overflow-x:
    auto;

  padding:
    1px 2px 4px;

  scrollbar-width:
    none;

  -webkit-overflow-scrolling:
    touch;
}

.filter-group::-webkit-scrollbar {
  display:
    none;
}

.filter-chip {

  flex-shrink:
    0;

  padding:
    7px 12px;

  border:
    1.5px solid var(--border);

  border-radius:
    var(--radius-full);

  background:
    white;

  color:
    var(--text-muted);

  font-size:
    .72rem;

  font-weight:
    500;

  white-space:
    nowrap;

  cursor:
    pointer;

  transition:
    .2s ease;
}

.filter-chip:hover {
  background:
    #F8FAFC;
}

.filter-chip.active {

  background:
    var(--text-main);

  color:
    white;

  border-color:
    var(--text-main);

  box-shadow:
    0 5px 13px
    rgba(15,23,42,.16);
}


/* =========================================================
   CONTENT
========================================================= */

.content-area {

  flex:
    1;

  min-height:
    0;

  overflow-y:
    auto;

  overflow-x:
    hidden;

  padding:
    calc(var(--header-height) + 17px)
    16px
    calc(var(--nav-height) + 28px);

  background:
    linear-gradient(
      180deg,
      #F7F8FB 0%,
      #F1F4F8 100%
    );

  display:
    flex;

  flex-direction:
    column;

  gap:
    15px;

  scroll-behavior:
    smooth;

  overscroll-behavior:
    contain;

  -webkit-overflow-scrolling:
    touch;

  scrollbar-width:
    thin;

  scrollbar-color:
    #CBD5E1 transparent;
}

.content-area::-webkit-scrollbar {
  width:
    5px;
}

.content-area::-webkit-scrollbar-thumb {

  background:
    #CBD5E1;

  border-radius:
    10px;
}


/* =========================================================
   RESULT INFO
========================================================= */

.result-header {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  padding:
    1px 2px;

  color:
    var(--text-muted);

  font-size:
    .7rem;
}

.result-count {

  background:
    white;

  border:
    1px solid var(--border);

  border-radius:
    var(--radius-full);

  padding:
    4px 8px;
}


/* =========================================================
   PLACE CARD
========================================================= */

.place-card {

  width:
    100%;

  flex-shrink:
    0;

  background:
    white;

  border:
    1px solid rgba(226,232,240,.75);

  border-radius:
    var(--radius-lg);

  overflow:
    hidden;

  box-shadow:
    var(--shadow-sm);

  cursor:
    pointer;

  animation:
    cardIn .38s ease both;

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

@keyframes cardIn {

  from {

    opacity:
      0;

    transform:
      translateY(8px);
  }

  to {

    opacity:
      1;

    transform:
      translateY(0);
  }
}

.place-card:hover {

  transform:
    translateY(-3px);

  box-shadow:
    var(--shadow-md);

  border-color:
    rgba(245,54,92,.14);
}

.place-card:active {
  transform:
    scale(.995);
}


/* =========================================================
   IMAGE
========================================================= */

.place-img-container {

  position:
    relative;

  width:
    100%;

  height:
    174px;

  overflow:
    hidden;

  background:
    linear-gradient(
      135deg,
      #E2E8F0,
      #CBD5E1
    );
}

.place-img {

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;

  display:
    block;

  opacity:
    0;

  transition:
    transform .5s ease,
    opacity .4s ease;
}

.place-img.loaded {
  opacity:
    1;
}

.place-card:hover .place-img {
  transform:
    scale(1.04);
}


/* =========================================================
   IMAGE OVERLAY
========================================================= */

.place-img-container::after {

  content:
    "";

  position:
    absolute;

  inset:
    0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.03),
      transparent 50%,
      rgba(0,0,0,.25)
    );

  pointer-events:
    none;
}


/* =========================================================
   BOOKMARK
========================================================= */

.bookmark-btn {

  position:
    absolute;

  top:
    11px;

  right:
    11px;

  z-index:
    5;

  width:
    37px;

  height:
    37px;

  border:
    1px solid rgba(255,255,255,.7);

  border-radius:
    50%;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:
    blur(10px);

  box-shadow:
    0 5px 16px rgba(0,0,0,.14);

  cursor:
    pointer;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    1rem;

  transition:
    transform .2s ease,
    background .2s ease;
}

.bookmark-btn:hover {
  transform:
    scale(1.08);
}

.bookmark-btn:active {
  transform:
    scale(.88);
}


/* =========================================================
   BADGE
========================================================= */

.place-badge {

  position:
    absolute;

  left:
    11px;

  bottom:
    11px;

  z-index:
    5;

  padding:
    5px 9px;

  border-radius:
    var(--radius-full);

  background:
    rgba(15,23,42,.76);

  color:
    white;

  font-size:
    .63rem;

  backdrop-filter:
    blur(8px);
}


/* =========================================================
   META
========================================================= */

.place-meta-bar {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    8px;

  padding:
    9px 13px;

  background:
    #FAFBFC;

  border-bottom:
    1px solid #F1F5F9;

  color:
    var(--text-muted);

  font-size:
    .68rem;
}

.meta-item {

  display:
    flex;

  align-items:
    center;

  gap:
    4px;

  min-width:
    0;
}

.meta-item span:last-child {

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;
}


/* =========================================================
   CARD INFO
========================================================= */

.place-info {
  padding:
    14px;
}

.place-title-row {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap:
    10px;

  margin-bottom:
    5px;
}

.place-name {

  font-size:
    .98rem;

  font-weight:
    700;

  line-height:
    1.35;
}

.place-price {

  flex-shrink:
    0;

  padding:
    4px 8px;

  border-radius:
    var(--radius-full);

  background:
    var(--green-bg);

  color:
    var(--green);

  border:
    1px solid rgba(16,185,129,.16);

  font-size:
    .64rem;

  font-weight:
    600;

  white-space:
    nowrap;
}

.place-location {

  display:
    flex;

  align-items:
    flex-start;

  gap:
    3px;

  color:
    var(--text-muted);

  font-size:
    .72rem;

  line-height:
    1.4;

  margin-bottom:
    7px;
}

.place-highlight {

  color:
    #475569;

  font-size:
    .76rem;

  line-height:
    1.55;

  margin-bottom:
    10px;

  display:
    -webkit-box;

  -webkit-line-clamp:
    2;

  -webkit-box-orient:
    vertical;

  overflow:
    hidden;
}


/* =========================================================
   TAGS
========================================================= */

.feature-tags {

  display:
    flex;

  flex-wrap:
    wrap;

  gap:
    5px;
}

.tag {

  padding:
    4px 7px;

  border-radius:
    6px;

  background:
    var(--tag-bg);

  color:
    var(--tag-text);

  border:
    1px solid rgba(226,232,240,.7);

  font-size:
    .63rem;

  font-weight:
    500;
}


/* =========================================================
   CARD ACTION
========================================================= */

.card-actions {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    12px;
}

.card-action {

  border:
    none;

  border-radius:
    10px;

  padding:
    8px;

  font-size:
    .68rem;

  font-weight:
    500;

  cursor:
    pointer;

  text-align:
    center;

  text-decoration:
    none;

  transition:
    .2s ease;
}

.card-action.detail {

  background:
    var(--primary-light);

  color:
    var(--primary);
}

.card-action.map {

  background:
    #F1F5F9;

  color:
    #334155;
}

.card-action:hover {
  transform:
    translateY(-1px);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {

  min-height:
    330px;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  gap:
    7px;

  color:
    var(--text-muted);

  padding:
    30px;
}

.empty-state-icon {

  width:
    72px;

  height:
    72px;

  border-radius:
    24px;

  background:
    var(--primary-light);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    2rem;

  margin-bottom:
    8px;
}

.empty-state strong {

  color:
    var(--text-main);

  font-size:
    .95rem;
}

.empty-state small {

  color:
    var(--text-light);

  font-size:
    .7rem;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {

  position:
    absolute;

  inset:
    0;

  z-index:
    100;

  display:
    none;

  align-items:
    flex-end;

  justify-content:
    center;

  background:
    rgba(15,23,42,.64);

  backdrop-filter:
    blur(7px);

  animation:
    fadeIn .2s ease;
}

.modal-overlay.show {
  display:
    flex;
}

@keyframes fadeIn {

  from {
    opacity:
      0;
  }

  to {
    opacity:
      1;
  }
}

.modal-content {

  width:
    100%;

  max-height:
    92%;

  overflow-y:
    auto;

  background:
    white;

  border-radius:
    26px 26px 0 0;

  padding:
    11px
    16px
    max(20px, env(safe-area-inset-bottom));

  box-shadow:
    0 -20px 60px rgba(0,0,0,.25);

  animation:
    slideUp .32s
    cubic-bezier(.16,1,.3,1);
}

@keyframes slideUp {

  from {
    transform:
      translateY(100%);
  }

  to {
    transform:
      translateY(0);
  }
}

.modal-content::before {

  content:
    "";

  display:
    block;

  width:
    42px;

  height:
    4px;

  margin:
    0 auto 12px;

  border-radius:
    99px;

  background:
    #CBD5E1;
}

.modal-header {

  position:
    sticky;

  top:
    0;

  z-index:
    5;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    10px;

  background:
    white;

  padding-bottom:
    10px;
}

.modal-title {

  font-size:
    1.02rem;

  font-weight:
    700;

  line-height:
    1.35;
}

.close-btn {

  width:
    34px;

  height:
    34px;

  flex-shrink:
    0;

  border:
    none;

  border-radius:
    50%;

  background:
    #F1F5F9;

  color:
    #64748B;

  cursor:
    pointer;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;
}

.modal-body {

  display:
    flex;

  flex-direction:
    column;

  gap:
    11px;

  font-size:
    .8rem;

  padding-bottom:
    4px;
}

.modal-img {

  width:
    100%;

  height:
    190px;

  object-fit:
    cover;

  border-radius:
    var(--radius-lg);
}

.info-row {

  display:
    flex;

  gap:
    8px;

  line-height:
    1.5;
}

.info-label {

  min-width:
    86px;

  flex-shrink:
    0;

  color:
    var(--text-muted);

  font-weight:
    600;
}

.action-btn {

  width:
    100%;

  margin-top:
    7px;

  padding:
    12px;

  border:
    none;

  border-radius:
    var(--radius-md);

  background:
    var(--primary-gradient);

  color:
    white;

  text-decoration:
    none;

  font-size:
    .82rem;

  font-weight:
    600;

  text-align:
    center;

  box-shadow:
    0 8px 20px rgba(245,54,92,.25);

  transition:
    .2s ease;
}

.action-btn:hover {
  transform:
    translateY(-1px);
}


/* =========================================================
   MAP PAGE
========================================================= */

.map-page {

  display:
    flex;

  flex-direction:
    column;

  gap:
    12px;
}

.map-hero {

  padding:
    18px;

  border-radius:
    var(--radius-lg);

  background:
    var(--primary-gradient);

  color:
    white;

  box-shadow:
    0 12px 28px rgba(245,54,92,.22);
}

.map-hero h2 {

  font-size:
    1.05rem;

  margin-bottom:
    3px;
}

.map-hero p {

  font-size:
    .72rem;

  opacity:
    .88;

  line-height:
    1.5;
}

.map-list {

  display:
    flex;

  flex-direction:
    column;

  gap:
    8px;
}

.map-item {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  padding:
    11px;

  border:
    1px solid var(--border);

  border-radius:
    13px;

  background:
    white;

  box-shadow:
    var(--shadow-sm);
}

.map-number {

  width:
    34px;

  height:
    34px;

  flex-shrink:
    0;

  border-radius:
    11px;

  background:
    var(--primary-light);

  color:
    var(--primary);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

/* =========================================================
   TOGGLE
========================================================= */

.toggle {

  position:
    relative;

  width:
    45px;

  height:
    25px;

  flex-shrink:
    0;
}

.toggle input {

  opacity:
    0;

  width:
    0;

  height:
    0;
}

.toggle-slider {

  position:
    absolute;

  inset:
    0;

  cursor:
    pointer;

  background:
    #CBD5E1;

  border-radius:
    999px;

  transition:
    .25s ease;
}

.toggle-slider::before {

  content:
    "";

  position:
    absolute;

  width:
    19px;

  height:
    19px;

  left:
    3px;

  top:
    3px;

  background:
    white;

  border-radius:
    50%;

  box-shadow:
    0 2px 5px rgba(0,0,0,.15);

  transition:
    .25s ease;
}

.toggle input:checked + .toggle-slider {

  background:
    var(--primary);
}

.toggle input:checked + .toggle-slider::before {

  transform:
    translateX(20px);
}

.settings-danger-btn {

  width:
    100%;

  margin-top:
    16px;

  padding:

========================================================= */

    0;

  height:

  display:

  align-items:
    center;

  justify-content:
    space-around;

  background:
    rgba(255,255,255,.97);

  border-top:
    1px solid #EDEFF3;

  box-shadow:
    0 -6px 20px rgba(15,23,42,.05);

  backdrop-filter:
    blur(18px);

  z-index:
    70;
}

.nav-item {

  flex:
    1;

  max-width:
    95px;

  height:
    53px;

  border-radius:
    14px;

  display:
    flex;

    column;

    .2s ease;

.nav-item:hover {

}

.nav-item.active {

  background:
    var(--primary-light);
}

.nav-icon {

  font-size:
    1.18rem;

  line-height:
    1;

  transition:
    transform .2s ease;
}

.nav-item.active .nav-icon {

  transform:
    translateY(-1px);
}


/* =========================================================
   BACK TO TOP
========================================================= */

.back-to-top {

  position:
    absolute;

  right:
    17px;

  bottom:
    calc(var(--nav-height) + 18px);

  width:
    41px;

  height:
    41px;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(23,32,51,.92);

  color:

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  cursor:
    pointer;

  z-index:
    45;

  box-shadow:
    0 7px 20px rgba(15,23,42,.22);

  animation:
    popIn .2s ease;
}

.back-to-top.show {
  display:
    flex;
}

@keyframes popIn {

  from {
    transform:
      scale(.7);

    opacity:
      0;
  }

  to {
    transform:
      scale(1);

    opacity:
      1;
  }
}

/* =========================================================
   IMAGE LOADING
========================================================= */

function prepareImages() {

  document
    .querySelectorAll(".place-img")
    .forEach(img => {

      if (img.complete) {

        img.classList.add(
          "loaded"
        );

      }

      else {

        img.addEventListener(
          "load",
          () => {
            img.classList.add(
              "loaded"
            );
          },
          {
            once: true
          }
        );

      }

    });

}

            📍

              ${escapeHtml(place.detail)}
            </span>
          </div>

            ${place.tags
              .map(
                tag =>
                  `<span class="tag">${escapeHtml(tag)}</span>`
              )
              .join("")}

          <div class="card-actions">

            <button
              class="card-action detail"
              data-detail="${place.id}"

              ดูรายละเอียด

              class="card-action map"
              href="${place.mapUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >

      `;


      placeList.appendChild(
        card
      );

    }
  );


  prepareImages();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch() {

  const query =
    searchInput.value
      .toLowerCase()
      .trim();


  clearSearchButton.style.display =
    query
      ? "flex"
      : "none";


  const filtered =
    places.filter(
      place => {

        const text =
          (
            place.name +
            " " +
            place.detail +
            " " +
            place.highlight +
            " " +
            place.tags.join(" ")
          )
          .toLowerCase();


        const matchesText =
          !query ||
          text.includes(query);


        const matchesCategory =
          currentCategory === "all" ||
          place.categories.includes(
            currentCategory
          );


        return (
          matchesText &&
          matchesCategory
        );

      }
    );


  renderPlaces(
    filtered
  );

}


searchInput.addEventListener(
  "input",
  handleSearch
);


function clearSearch() {

  searchInput.value =
    "";

  handleSearch();

  searchInput.focus();
}


/* =========================================================
   FILTER
========================================================= */

document
  .querySelectorAll(
    ".filter-chip"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter-chip"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentCategory =
            button.dataset.category;


          handleSearch();

        }
      );

    }
  );


/* =========================================================
   BOOKMARK
========================================================= */

function toggleBookmark(
  placeId
) {

  const index =
    bookmarkedIds.indexOf(
      placeId
    );


  if (index >= 0) {

    bookmarkedIds.splice(
      index,
      1
    );

  }

  else {

    bookmarkedIds.push(
      placeId
    );

  }


  localStorage.setItem(
    "studyspot_bookmarks",
    JSON.stringify(
      bookmarkedIds
    )
  );


  if (
    currentTab === "บุ๊กมาร์ก"
  ) {

    renderBookmarks();

  }

  else {

    handleSearch();

  }

}


/* =========================================================
   CARD EVENT DELEGATION
========================================================= */

placeList.addEventListener(
  "click",
  event => {

    const bookmark =
      event.target.closest(
        "[data-bookmark]"
      );

    if (bookmark) {

      event.preventDefault();

      event.stopPropagation();

      toggleBookmark(
        Number(
          bookmark.dataset.bookmark
        )
      );

      return;
    }


    const detail =
      event.target.closest(
        "[data-detail]"
      );

    if (detail) {

      openDetailModal(
        Number(
          detail.dataset.detail
        )
      );

      return;
    }


    const card =
      event.target.closest(
        ".place-card"
      );


    if (
      card &&
      !event.target.closest(
        "a,button"
      )
    ) {

      const detailButton =
        card.querySelector(
          "[data-detail]"
        );

      if (detailButton) {

        openDetailModal(
          Number(
            detailButton.dataset.detail
          )
        );

      }

    }

  }
);


/* =========================================================
   BOOKMARK PAGE
========================================================= */

function renderBookmarks() {

  const list =
    places.filter(
      place =>
        bookmarkedIds.includes(
          place.id
        )
    );


  if (!list.length) {

    placeList.innerHTML = `

      <div class="empty-state">

        <div class="empty-state-icon">
          ⭐
        </div>

        <strong>
          ยังไม่มีรายการโปรด
        </strong>

        <small>
          กด 🤍 บนร้านที่คุณชอบ
          เพื่อเก็บไว้ดูภายหลัง
        </small>

      </div>

    `;

    return;
  }


  renderPlaces(
    list
  );

}

function openCurrentLocation() {

  if (!navigator.geolocation) {

    alert(
      "อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      const url =
        `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    },

    error => {

      let message =
        "ไม่สามารถระบุตำแหน่งได้";

      if (error.code === 1) {

        message =
          "กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่งของคุณก่อน";

      }

      else if (error.code === 2) {

        message =
          "ไม่พบตำแหน่งปัจจุบัน กรุณาลองใหม่อีกครั้ง";

      }

      else if (error.code === 3) {

        message =
          "การค้นหาตำแหน่งใช้เวลานานเกินไป กรุณาลองใหม่";

      }

      alert(message);

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function switchNav(
  element,
  pageName
) {

  currentTab =
    pageName;


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  element.classList.add(
    "active"
  );


  navigateTo(
    pageName
  );


  scrollToTop();

}


function switchNavToSettings() {

  switchNav(
    document.getElementById(
      "navSettings"
    ),
    "ตั้งค่า"
  );

}


/* =========================================================
   ROUTING
========================================================= */

function navigateTo(
  pageName
) {

  const filters =
    document.getElementById(
      "filterGroupContainer"
    );

  const search =
    document.getElementById(
      "searchBoxContainer"
    );

  const title =
    document.getElementById(
      "headerTitle"
    );


  if (
    pageName === "ค้นหา"
  ) {

    filters.style.display =
      "flex";

    search.style.display =
      "block";

    title.textContent =
      "พิกัดที่อ่านหนังสือวันนี้";


    handleSearch();

  }


  else if (
    pageName === "บุ๊กมาร์ก"
  ) {

    filters.style.display =
      "none";

    search.style.display =
      "none";

    title.textContent =
      "ร้านที่บุ๊กมาร์กไว้ ⭐";


    renderBookmarks();

  }


  else if (
    pageName === "แผนที่"
  ) {

    filters.style.display =
      "none";

    search.style.display =
      "none";

    title.textContent =
      "แผนที่ StudySpot 📍";


    renderMapPage();

  }


  else if (
    pageName === "ตั้งค่า"
  ) {

    filters.style.display =
      "none";

    search.style.display =
      "none";

    title.textContent =
      "ตั้งค่า ⚙️";


    renderSettings();

  }

}

/* =========================================================
   CLEAR BOOKMARKS
========================================================= */

function clearBookmarks() {

  if (
    !bookmarkedIds.length
  ) {

    alert(
      "ยังไม่มีรายการโปรด"
    );

    return;
  }


  const confirmed =
    confirm(
      "ต้องการล้างรายการโปรดทั้งหมดหรือไม่?"
    );


  if (!confirmed) return;


  bookmarkedIds =
    [];


  localStorage.removeItem(
    "studyspot_bookmarks"
  );


  alert(
    "ล้างรายการโปรดเรียบร้อยแล้ว"
  );


  renderSettings();

}


/* =========================================================
   SCROLL HEADER
========================================================= */

/*
   ระบบสำคัญสำหรับสิ่งที่ขอ:

   - เลื่อนลง -> Header หายขึ้นด้านบน
   - เลื่อนขึ้น -> Header กลับมา
   - ถ้าอยู่บนสุด -> Header แสดงเสมอ
   - ไม่เปลี่ยนข้อมูลร้าน
   - ไม่ reload หน้า
*/

placeList.addEventListener(
  "scroll",
  () => {

    const currentScroll =
      placeList.scrollTop;


    const difference =
      currentScroll -
      lastScrollTop;


    /* BACK TO TOP */

    if (
      currentScroll > 350
    ) {

      backToTop.classList.add(
        "show"
      );

    }

    else {

      backToTop.classList.remove(
        "show"
      );

    }


    /* อยู่บนสุด */

    if (
      currentScroll <= 10
    ) {

      header.classList.remove(
        "header-hidden"
      );

      lastScrollTop =
        currentScroll;

      return;
    }


    /*
       เลื่อนลง:
       ซ่อน Header
    */

    if (
      difference > 5
    ) {

      header.classList.add(
        "header-hidden"
      );

    }


    /*
       เลื่อนขึ้น:
       ซ่อน Header
    */

    else if (
      difference < -5
    ) {

      header.classList.add(
        "header-hidden"
      );

    }


    lastScrollTop =
      currentScroll;

  },
  {
    passive:
      true
  }
);


/* =========================================================
   BACK TO TOP
========================================================= */

function scrollToTop() {

  placeList.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });


  header.classList.remove(
    "header-hidden"
  );

}

========================================================= */

);


/* =========================================================
   PREVENT BODY SCROLL
========================================================= */

      )
    ) {

    }

);
