<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpot - คาเฟ่และสถานที่อ่านหนังสือราคานักศึกษา</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #F5365C;
      --primary-gradient: linear-gradient(135deg, #FF4B72 0%, #D81B60 100%);
      --primary-light: #FFF0F3;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --tag-bg: #F1F5F9;
      --tag-text: #475569;
      --accent-green: #10B981;
      --accent-green-bg: #ECFDF5;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       APP CONTAINER
    ========================= */

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 500px) {
      body {
        padding: 1.5rem;
      }

      .app-container {
        height: 92vh;
        max-height: 92vh;
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      flex: 0 0 auto;
      padding: 1.15rem 1.25rem 0.85rem;
      background: #FFFFFF;
      border-bottom: 1px solid #F1F5F9;
      z-index: 10;
    }

    .user-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
    }

    .greeting {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .username {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .avatar {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: var(--radius-full);
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(245, 54, 92, 0.3);
      transition: transform 0.2s;
    }

    .avatar:active {
      transform: scale(0.95);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin-bottom: 0.8rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border-radius: var(--radius-md);
      border: 1.5px solid #E2E8F0;
      font-size: 0.9rem;
      outline: none;
      background-color: #F8FAFC;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: #94A3B8;
    }

    .search-input:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(245, 54, 92, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #94A3B8;
      pointer-events: none;
    }

    /* =========================
       FILTER
    ========================= */

    .filter-group {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
    }

    .filter-group::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      flex: 0 0 auto;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-full);
      border: 1.5px solid #E2E8F0;
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* =========================
       MAIN SCROLL AREA
    ========================= */

    .content-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      background: var(--bg);

      /* ทำให้เลื่อนบนมือถือได้ลื่น */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;

      /* ป้องกัน scrollbar ทำให้ layout กระตุก */
      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }

    .content-area::-webkit-scrollbar {
      width: 5px;
    }

    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }

    /* =========================
       PLACE CARD
    ========================= */

    .place-card {
      flex: 0 0 auto;
      width: 100%;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #FFFFFF;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .place-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .place-img-container {
      position: relative;
      width: 100%;
      height: 155px;
      flex-shrink: 0;
    }

    .place-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #E2E8F0;
    }

    .bookmark-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: var(--radius-full);
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .bookmark-btn:active {
      transform: scale(0.85);
    }

    .place-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background-color: #F8FAFC;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid #F1F5F9;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
      min-width: 0;
    }

    .place-info {
      padding: 1rem;
    }

    .place-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
      gap: 0.6rem;
    }

    .place-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      min-width: 0;
    }

    .place-price {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-green);
      background: var(--accent-green-bg);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      white-space: nowrap;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .place-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.2rem;
      line-height: 1.4;
    }

    .place-highlight {
      font-size: 0.83rem;
      color: #475569;
      margin-bottom: 0.75rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feature-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 500;
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-content {
      width: 100%;
      max-height: 88%;
      min-height: 0;
      background: #FFFFFF;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
      position: sticky;
      top: -1rem;
      background: #FFFFFF;
      padding-top: 0.5rem;
      padding-bottom: 0.75rem;
      z-index: 5;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      padding-right: 0.5rem;
    }

    .close-btn {
      flex: 0 0 auto;
      background: #F1F5F9;
      border: none;
      border-radius: var(--radius-full);
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      font-size: 0.88rem;
      padding-bottom: 0.25rem;
    }

    .modal-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      display: block;
      margin-bottom: 0.25rem;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .info-label {
      font-weight: 600;
      min-width: 95px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .action-btn {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.85rem;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(245, 54, 92, 0.35);
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .nav-bar {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.55rem 0 calc(0.55rem + env(safe-area-inset-bottom));
      border-top: 1px solid #F1F5F9;
      background: rgba(255, 255, 255, 0.98);
      z-index: 110;

      transition:
        padding 0.25s ease,
        height 0.25s ease,
        transform 0.25s ease;
    }

    .nav-item {
      min-width: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.25rem;
      line-height: 1;
      margin-bottom: 0.15rem;
      transition: transform 0.2s ease;
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px);
    }

    /*
      เมื่อเปิดรายละเอียดคาเฟ่:
      - แถบด้านล่างลดความสูง
      - ซ่อนข้อความ
      - เหลือไอคอนเพื่อเพิ่มพื้นที่หน้าจอ
    */

    .app-container.detail-open .nav-bar {
      padding-top: 0.3rem;
      padding-bottom: calc(0.3rem + env(safe-area-inset-bottom));
    }

    .app-container.detail-open .nav-item {
      min-width: 48px;
      padding: 0.15rem 0.45rem;
    }

    .app-container.detail-open .nav-item > span:last-child {
      display: none;
    }

    .app-container.detail-open .nav-icon {
      margin-bottom: 0;
      font-size: 1.1rem;
    }

    .app-container.detail-open .nav-item.active .nav-icon {
      transform: none;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      flex: 0 0 auto;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: var(--shadow-sm);
    }

    .profile-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.2rem;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 0.5rem;
    }

    .empty-state {
      flex: 1 0 auto;
      min-height: 260px;
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .empty-state-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      opacity: 0.6;
    }

    /* =========================
       SMALL SCREEN
    ========================= */

    @media (max-width: 380px) {
      .header {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .content-area {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .place-img-container {
        height: 145px;
      }

      .place-info {
        padding: 0.85rem;
      }

      .place-name {
        font-size: 1rem;
      }

      .place-price {
        font-size: 0.7rem;
      }

      .info-label {
        min-width: 82px;
      }
    }
  </style>

</head>

  let bookmarkedIds = [];

  /* ==========================================
     RENDER PLACES
  ========================================== */

  function renderPlaces(data) {

    const container = document.getElementById('placeList');

    container.innerHTML = '';

    if (data.length === 0) {

      container.innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">🔍</span>
          <p>ไม่พบสถานที่ที่คุณกำลังค้นหา</p>
        </div>
      `;

      return;
    }


    data.forEach(place => {

      const card = document.createElement('div');

      card.className = 'place-card';

      const isBookmarked =
        bookmarkedIds.includes(place.id);


      card.innerHTML = `

        <div class="place-img-container">

          <button
            class="bookmark-btn ${isBookmarked ? 'active-bm' : ''}"
            onclick="toggleBookmark(event, ${place.id})"
          >
            ${isBookmarked ? '❤️' : '🤍'}
          </button>

          <img
            src="${place.image}"
            alt="${place.name}"
            class="place-img"
            onclick="openDetailModal(${place.id})"
          >

        </div>


        <div
          class="place-meta-bar"
          onclick="openDetailModal(${place.id})"
        >

          <div class="meta-item">
            <span>🕒</span>
            <span>${place.hours}</span>
          </div>

          <div class="meta-item">
            <span>📍</span>
            <span>
              ${place.distanceKm} กม.
              (${place.travelTimeMin} นาที)
            </span>
          </div>

        </div>


        <div
          class="place-info"
          onclick="openDetailModal(${place.id})"
        >

          <div class="place-title-row">

            <div class="place-name">
              ${place.name}
            </div>

            <div class="place-price">
              ${place.price}
            </div>

          </div>


          <div class="place-location">
            📍 ${place.detail}
          </div>


          <div class="place-highlight">
            ${place.highlight}
          </div>


          <div class="feature-tags">

            ${place.tags
              .map(tag => `<span class="tag">${tag}</span>`)
              .join('')}

          </div>

        </div>

      `;

      container.appendChild(card);

    });
  }


  /* ==========================================
     OPEN DETAIL
  ========================================== */

  function openDetailModal(placeId) {

    const place =
      places.find(p => p.id === placeId);

    if (!place) return;


    document.getElementById('modalName')
      .textContent = place.name;


    const modalBody =
      document.getElementById('modalBody');


    modalBody.innerHTML = `

      <img
        src="${place.image}"
        alt="${place.name}"
        class="modal-img"
      >


      <div class="info-row">
        <span class="info-label">
          ราคาเริ่มต้น:
        </span>

        <span>
          ${place.price}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          ทำเลที่ตั้ง:
        </span>

        <span>
          ${place.detail}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เวลาเปิด-ปิด:
        </span>

        <span>
          ${place.hours}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          จุดเด่น:
        </span>

        <span>
          ${place.highlight}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เมนูแนะนำ:
        </span>

        <span>
          ${place.recommendedMenu}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          การจอดรถ:
        </span>

        <span>
          ${place.parking}
        </span>
      </div>


      <div class="info-row">
        <span class="info-label">
          เบอร์ติดต่อ:
        </span>

        <span>
          ${place.phone}
        </span>
      </div>


      <div class="feature-tags">

        ${place.tags
          .map(tag => `<span class="tag">${tag}</span>`)
          .join('')}

      </div>


      <a
        class="action-btn"
        href="${place.mapUrl}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 เปิดแผนที่ Google Maps นำทาง
      </a>

    `;


    /*
      เปิด Modal
      และเพิ่ม class detail-open
      เพื่อย่อ Bottom Navigation
    */

    document
      .getElementById('detailModal')
      .classList.add('show');

    document
      .getElementById('appContainer')
      .classList.add('detail-open');


    /*
      ป้องกันหน้าหลักเลื่อนขณะดูรายละเอียด
    */

    document
      .getElementById('placeList')
      .style.overflow = 'hidden';
  }


  /* ==========================================
     CLOSE MODAL
  ========================================== */

  function closeModal() {

    document
      .getElementById('detailModal')
      .classList.remove('show');


    document
      .getElementById('appContainer')
      .classList.remove('detail-open');


    document
      .getElementById('placeList')
      .style.overflow = '';
  }


  /* ==========================================
     CLICK OUTSIDE MODAL
  ========================================== */

  function handleOverlayClick(event) {

    if (
      event.target ===
      document.getElementById('detailModal')
    ) {
      closeModal();
    }
  }

        .value

            .includes(query) ||

          place.detail
            .toLowerCase()
            .includes(query) ||

          place.highlight
            .toLowerCase()
            .includes(query);


        const matchesCategory =
          currentCategory === 'all' ||
          place.categories
            .includes(currentCategory);


        return matchesSearch &&
               matchesCategory;
      });


    renderPlaces(filtered);
  }


  /* ==========================================
     BOOKMARK
  ========================================== */

  function toggleBookmark(event, placeId) {

    event.stopPropagation();


    const index =
      bookmarkedIds.indexOf(placeId);


    if (index > -1) {

      bookmarkedIds.splice(index, 1);

    } else {

      bookmarkedIds.push(placeId);

    }


    if (currentTab === 'ค้นหา') {

      handleSearch();

    } else if (currentTab === 'บุ๊กมาร์ก') {

      renderBookmarks();

    }
  }


  /* ==========================================
     BOOKMARK LIST
  ========================================== */

  function renderBookmarks() {

    const bookmarkedPlaces =
      places.filter(place =>
        bookmarkedIds.includes(place.id)
      );


    if (bookmarkedPlaces.length === 0) {

      const container =
        document.getElementById('placeList');


      container.innerHTML = `
        <div class="empty-state">

          <span class="empty-state-icon">
            ⭐
          </span>

          <p>
            ยังไม่มีรายการที่ถูกบันทึกไว้
          </p>

        </div>
      `;

    } else {

      renderPlaces(bookmarkedPlaces);

    }
  }


  /* ==========================================
     PROFILE
  ========================================== */

  function renderProfile() {

    const container =
      document.getElementById('placeList');


    const userMapUrl =
      `https://www.google.com/maps/search/?api=1&query=${userInfo.lat},${userInfo.lng}`;


    container.innerHTML = `

      <div class="profile-card">

        <div class="profile-title">
          ข้อมูลส่วนตัวผู้ใช้
        </div>


        <div class="info-row">

          <span class="info-label">
            ชื่อ-นามสกุล:
          </span>

          <span>
            ${userInfo.name}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            รหัสนักศึกษา:
          </span>

          <span>
            ${userInfo.studentId}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            พิกัดปัจจุบัน:
          </span>

          <span>
            ${userInfo.location}
          </span>

        </div>


        <a
          class="action-btn"
          href="${userMapUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 เปิดแผนที่พิกัดของฉัน
        </a>

      </div>

    `;
  }


  /* ==========================================
     FILTER
  ========================================== */

  function filterPlaces(category, element) {

    currentCategory = category;


    document
      .querySelectorAll('.filter-chip')
      .forEach(btn =>
        btn.classList.remove('active')
      );


    element.classList.add('active');


    handleSearch();
  }


  /* ==========================================
     NAVIGATION
  ========================================== */

  function switchNav(element, pageName) {

    /*
      ถ้ามี Modal เปิดอยู่ ให้ปิดก่อน
    */

    closeModal();


    currentTab = pageName;


    document
      .querySelectorAll('.nav-item')
      .forEach(item =>
        item.classList.remove('active')
      );


    element.classList.add('active');


    navigateTo(pageName);
  }


  function switchNavToProfile() {

    const profileNav =
      document.getElementById('navProfile');


    switchNav(
      profileNav,
      'โปรไฟล์'
    );
  }


  /* ==========================================
     PAGE NAVIGATION
  ========================================== */

  function navigateTo(pageName) {

    const filterGroup =
      document.getElementById(
        'filterGroupContainer'
      );

    const searchBox =
      document.getElementById(
        'searchBoxContainer'
      );

    const headerTitle =
      document.getElementById(
        'headerTitle'
      );


    if (pageName === 'ค้นหา') {

      filterGroup.style.display = 'flex';
      searchBox.style.display = 'block';

      headerTitle.textContent =
        'พิกัดที่อ่านหนังสือวันนี้';


      handleSearch();


    } else if (pageName === 'บุ๊กมาร์ก') {

      filterGroup.style.display = 'none';
      searchBox.style.display = 'none';

      headerTitle.textContent =
        'ร้านที่บุ๊กมาร์กไว้ ⭐';


      renderBookmarks();


    } else if (pageName === 'แผนที่') {

      window.open(
        'https://www.google.com/maps/search/คาเฟ่อ่านหนังสือ+พิษณุโลก',
        '_blank'
      );


    } else if (pageName === 'โปรไฟล์') {

      filterGroup.style.display = 'none';
      searchBox.style.display = 'none';

      headerTitle.textContent =
        'โปรไฟล์ผู้ใช้ 👤';


      renderProfile();
    }
  }


  /* ==========================================
     ESC KEY
  ========================================== */

  document.addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Escape') {
        closeModal();
      }

    }
  );


  /* ==========================================
     INITIAL LOAD
  ========================================== */

  renderPlaces(places);

</script>

</body>
</html>
